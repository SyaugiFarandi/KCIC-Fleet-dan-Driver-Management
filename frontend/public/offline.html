<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Offline — KCIC Fleet</title>
    <style>
      :root {
        --brand: #831d27;
        --brand-soft: #f6e7e9;
        --ink: #1e2633;
        --muted: #5a6473;
        --line: #e5e8ee;
        --bg: #f4f6f9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      }
      main {
        max-width: 420px;
        width: 100%;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(17, 24, 39, 0.1);
      }
      .mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        border-radius: 14px;
        background: linear-gradient(135deg, #9c2732, #5b1119);
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        font-size: 20px;
        font-family: 'Manrope', system-ui, sans-serif;
      }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { margin: 0 0 20px; font-size: 13.5px; line-height: 1.6; color: var(--muted); }
      button {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 9px;
        padding: 11px 20px;
        cursor: pointer;
      }
      button:hover { background: #5b1119; }
      small { display: block; margin-top: 18px; font-size: 11.5px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">W</div>
      <h1>Anda sedang offline</h1>
      <p>
        Halaman ini membutuhkan koneksi ke server KCIC Fleet. Periksa jaringan Anda, lalu coba lagi. Data yang
        terakhir dimuat di aplikasi tetap dapat dilihat setelah koneksi pulih.
      </p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
      <small>Aplikasi demo — bukan data resmi KCIC.</small>
    </main>
  </body>
</html>
