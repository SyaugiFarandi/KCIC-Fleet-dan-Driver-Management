services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet_demo_password
      POSTGRES_DB: fleet_demo
    ports:
      - "${DB_PORT:-5544}:5432"
    volumes:
      - fleet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-true}
      DATABASE_URL: postgresql://fleet:fleet_demo_password@db:5432/fleet_demo?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib di-set di .env (minimal 32 karakter acak)}
      PORT: 4000
      GPS_SIM_ENABLED: ${GPS_SIM_ENABLED:-true}
      GPS_SIM_INTERVAL_MS: ${GPS_SIM_INTERVAL_MS:-15000}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      GPS_INGEST_TOKEN: ${GPS_INGEST_TOKEN:-}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALLOW_DEMO_SEED: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-4010}:4000"
    command: sh -c "npx prisma generate && npx prisma migrate deploy && node prisma/seed.js && node src/server.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8090}:80"

volumes:
  fleet_pgdata:
